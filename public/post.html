<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  (function () {
    if (localStorage.getItem('devlog-theme') === 'dark') {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>
<title>DevLog</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="site-header">
  <a href="/" class="brand">DevLog</a>
  <div class="header-actions" id="post-actions"></div>
</header>

<main class="post-detail">
  <span class="category-badge" id="post-category"></span>
  <h1 id="post-title"></h1>
  <div class="card-meta post-detail-meta">
    <time id="post-date"></time>
    <div class="card-tags" id="post-tags"></div>
  </div>
  <article id="post-content" class="markdown-body"></article>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/post.js"></script>
</body>
</html>
