# Optional: trigger a Render deploy via Deploy Hook on every push to main.
# Prefer Render's native GitHub auto-deploy (enabled by render.yaml / dashboard).
# Use this only if you want an explicit Actions-based trigger.
#
# Setup:
# 1. Render Dashboard → your service → Settings → Deploy Hook → copy URL
# 2. GitHub repo → Settings → Secrets → Actions → add RENDER_DEPLOY_HOOK

name: Deploy to Render

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set. Skipping."
            echo "Connect the repo in Render Dashboard for native auto-deploy, or add the secret."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy hook triggered."
